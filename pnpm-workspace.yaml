packages:
    - .
    - plugins/*

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
    - 'undici'
    - '@ai-sdk/*'
    - '@ai-sdk/ui-utils'
    - '@ai-sdk/provider-utils'
    - '@ai-sdk/provider'
    - 'ai'
    - '@ai-sdk/google'
    - '@ai-sdk/openai'
    - '@posthog/brand'
    - '@posthog/icons'
    - '@posthog/hedgehog-mode'
    - '@typecaast/react'
    - '@typecaast/core'
    - '@typecaast/schema'
    - '@typecaast/skin-kit'
    - '@typecaast/skins'
blockExoticSubdeps: true
trustPolicy: ignore

# Hoist Gatsby's internal dependencies for webpack compatibility
publicHoistPattern:
    - '*webpack-hot-middleware*'
    - '*error-stack-parser*'
    - '*platform*'
    - '*css.escape*'
    - '*anser*'
