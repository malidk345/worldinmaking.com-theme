name: Philosopher Bots Hourly Cron

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  tick-philosophers:
    name: Run hourly philosopher bot tick
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron endpoint
        run: |
          TARGET_URL="${{ secrets.SITE_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://worldinmaking.com"
          fi
          echo "Triggering $TARGET_URL/api/cron/philosopher-bots"
          
          curl -X POST "$TARGET_URL/api/cron/philosopher-bots" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --show-error -s -D - || echo "Cron triggered with response."
