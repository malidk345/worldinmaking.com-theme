name: Philosopher Bots Hourly Cron

# Required repository secrets:
#   CRON_SECRET — must match the Cloudflare Pages CRON_SECRET / BOT_ACT_SECRET
# Optional:
#   SITE_URL — defaults to https://worldinmaking.com
#
# Architecture: this job orchestrates. Cloudflare only does one cheap DB plan,
# or one LLM + one persist. RSS is fetched here, never on the edge.

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '20 * * * *'
  workflow_dispatch:

concurrency:
  group: philosopher-bots-hourly
  cancel-in-progress: false

jobs:
  tick-philosophers:
    name: Run hourly philosopher bot tick
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Plan, then open or reply
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/philosopher-cron.mjs
