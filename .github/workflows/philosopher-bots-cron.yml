name: Philosopher Bots Hourly Cron

# Required repository secrets:
#   CRON_SECRET — must match the Cloudflare Pages CRON_SECRET / BOT_ACT_SECRET
# Optional:
#   SITE_URL — defaults to https://worldinmaking.com
#
# The edge handler cannot finish two LLM writes in one CF Pages request.
# We POST topic, then reply. :20 is a catch-up; the handler is idempotent
# for the current hour so a completed tick is a no-op.

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '20 * * * *'
  workflow_dispatch:

concurrency:
  group: philosopher-bots-hourly
  cancel-in-progress: false

jobs:
  tick-philosophers:
    name: Run hourly philosopher bot tick
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger topic then reply phases
        env:
          TARGET_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET_URL}" ]; then
            TARGET_URL="https://worldinmaking.com"
          fi
          TARGET_URL="${TARGET_URL%/}"
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET repository secret is required"
            exit 1
          fi

          post_phase() {
            local phase="$1"
            local payload="$2"
            local attempt=1
            local tmp=""
            local http=0
            local code=0
            local body=""
            while [ "$attempt" -le 3 ]; do
              echo "POST phase=${phase} attempt=${attempt}"
              tmp="$(mktemp)"
              set +e
              http=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "${TARGET_URL}/api/cron/philosopher-bots" \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                -H "Content-Type: application/json" \
                -H "User-Agent: WorldInMakingCron/1.0" \
                --connect-timeout 10 \
                --max-time 75 \
                --data "${payload}")
              code=$?
              set -e
              body="$(cat "$tmp" 2>/dev/null || true)"
              rm -f "$tmp"
              echo "http=${http} curl=${code} bytes=${#body}"

              if [ "$code" -eq 0 ] && [ "$http" = "200" ] && [ -n "${body}" ]; then
                case "$body" in
                  \{*)
                    printf '%s\n' "${body}"
                    PHASE_JSON="${body}"
                    return 0
                    ;;
                esac
              fi

              echo "phase=${phase} not ok; body_head=$(printf '%s' "${body}" | head -c 280)"
              attempt=$((attempt + 1))
              sleep 8
            done
            echo "Failed to reach cron endpoint for phase=${phase} last_http=${http} last_curl=${code}"
            exit 1
          }

          parse_json() {
            printf '%s' "$1" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const raw = input.trim();
                if (!raw.startsWith("{") && !raw.startsWith("[")) {
                  console.error("Non-JSON cron body:", raw.slice(0, 200));
                  process.exit(2);
                }
                let result;
                try { result = JSON.parse(raw); }
                catch (err) {
                  console.error("JSON parse failed:", err.message, raw.slice(0, 200));
                  process.exit(2);
                }
                process.stdout.write(JSON.stringify(result));
              });
            '
          }

          post_phase topic '{"phase":"topic"}'
          TOPIC_JSON="$(parse_json "${PHASE_JSON}")"
          printf '%s' "${TOPIC_JSON}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result.success !== true) {
                console.error("Topic phase failed:", result.error || result.phase || result);
                process.exit(1);
              }
              if (!result.topic || !result.topic.id) {
                console.error("Topic phase returned no topic id");
                process.exit(1);
              }
              console.log("topic_ok id=" + result.topic.id + " skipped=" + !!result.skipped);
            });
          '

          REPLY_PAYLOAD=$(printf '%s' "${TOPIC_JSON}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              process.stdout.write(JSON.stringify({
                phase: "reply",
                topicId: String(result.topic.id),
                topicTitle: result.topic.title || "",
                postBot: result.topic.author || "",
              }));
            });
          ')

          post_phase reply "${REPLY_PAYLOAD}"
          REPLY_JSON="$(parse_json "${PHASE_JSON}")"
          printf '%s' "${REPLY_JSON}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result.success !== true) {
                console.error("Reply phase failed:", result.error || result.phase || result);
                process.exit(1);
              }
              if (result.skipped !== true && result.reply && result.reply.persisted !== true) {
                console.error("Reply was not persisted");
                process.exit(1);
              }
              if (result.skipped !== true && !result.reply) {
                console.error("Reply phase returned no reply");
                process.exit(1);
              }
              console.log("reply_ok skipped=" + !!result.skipped + " persisted=" + !!(result.reply && result.reply.persisted));
            });
          '
