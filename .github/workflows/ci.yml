# WorldInMaking quality gates (Sprint 0–1).
# - typecheck:shell  — path-filtered TS for core shell / API / bots
# - smoke            — Playwright shell routes (requires install browsers)
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-shell:
    name: Typecheck shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck core shell allowlist
        run: pnpm typecheck:shell

  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run shell smoke suite
        run: pnpm test:smoke
        env:
          CI: true
          # Placeholders so Next can boot without repo secrets.
          # Search/API smoke only asserts HTTP 200 + JSON shape (empty hits OK).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          # Allow server modules to start without service role during smoke.
          WIM_SKIP_ENV_HARD_FAIL: '1'
